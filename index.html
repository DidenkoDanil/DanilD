<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #e8e8e8;
      --red: #e31c23;
      --dark: #111;
      --card-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      max-width: 100%;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      min-height: 100dvh;
      height: 100dvh;
      overflow: hidden;
      color: var(--dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 1.25rem 1rem 0;
      position: relative;
    }

    .cross {
      position: absolute;
      color: #bbb;
      font-size: 0.7rem;
      font-weight: 300;
      user-select: none;
      pointer-events: none;
    }
    .cross-1 { top: 8%; left: 12%; }
    .cross-2 { top: 6%; right: 18%; }
    .cross-3 { top: 22%; left: 8%; }
    .cross-4 { top: 20%; right: 10%; }

    .header {
      text-align: center;
      width: 100%;
      max-width: 1000px;
      position: relative;
      z-index: 10;
      margin-bottom: 0.5rem;
    }

    .welcome {
      font-size: 0.85rem;
      letter-spacing: 0.35em;
      font-weight: 500;
      color: #444;
      margin-bottom: 0.25rem;
      text-transform: uppercase;
    }

    /* Vector Wordmark host */
    .title-wrapper {
      position: relative;
      width: 100%;
      max-width: 900px;
      height: clamp(140px, 22vw, 220px);
      margin: 0.25rem auto 1rem;
      overflow: hidden;
      border-radius: 4px;
    }

    #wordmark {
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      background: transparent;
    }

    .meta {
      display: flex;
      justify-content: space-between;
      max-width: 620px;
      margin: 0 auto;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      font-weight: 500;
      color: #555;
      text-transform: uppercase;
      padding: 0 1rem;
    }

    /* ── Circular cards stage ── */
    .stage {
      position: relative;
      width: 100%;
      flex: 1;
      min-height: 520px;
      height: calc(100vh - 280px);
      margin-top: 0.5rem;
      overflow: visible;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      touch-action: none;
    }

    .circle-track {
      position: absolute;
      left: 50%;
      bottom: -100px; /* center shifted 100px down */
      width: 0;
      height: 0;
      transform-origin: center center;
      will-change: transform;
    }

    .card {
      position: absolute;
      width: 187px;
      height: 267px;
      border-radius: 16px;
      background: #fff;
      box-shadow: var(--card-shadow);
      overflow: hidden;
      cursor: pointer;
      transform-origin: center center;
      will-change: transform;
      transition: box-shadow 0.35s ease, filter 0.35s ease;
      left: 0;
      top: 0;
      margin-left: -93.5px;
      margin-top: -133.5px;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .card.card-empty {
      background: linear-gradient(160deg, #f5f5f5, #e0e0e0);
      box-shadow: 0 12px 28px -10px rgba(0,0,0,0.18);
      pointer-events: auto;
    }

    .card.card-empty::after {
      content: '';
      position: absolute;
      inset: 14px;
      border: 1px dashed #ccc;
      border-radius: 12px;
      opacity: 0.55;
    }

    /* no z-index change on hover — hierarchy is fixed by position */
    .card:hover {
      box-shadow: 0 28px 50px -12px rgba(0,0,0,0.4);
    }

    .card.is-active {
      filter: brightness(1.05);
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      -webkit-user-drag: none;
      user-drag: none;
      pointer-events: none;
    }

    .card-red {
      background: var(--red);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card-red .logo { width: 100px; height: 100px; }

    .card-photo { background: #1a1a1a; }
    .card-photo .overlay {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(4px);
      color: #fff;
      font-size: 0.65rem;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    .card-polestar {
      background: linear-gradient(145deg, #f0f0f0, #d8d8d8);

      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      text-align: center;
    }
    .card-polestar .ratio {

      letter-spacing: -0.05em;
      color: #111;

    }
    .card-polestar .brand {
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-top: 0.5rem;
      color: #444;
    }

    .card-casino .label {

    /* SPACE card — white with flowing gold border + photo */
    .card-space {
      background: #fff;
    }
    .card-space .space-photo {
      position: absolute;
      inset: 18px;
      border-radius: 10px;
      overflow: hidden;
      background: #fff;
    }
    .card-space .space-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }
    .card-space::after {
      content: '';
      position: absolute;
      inset: 14px;
      border-radius: 12px;
      padding: 2px;
      background: linear-gradient(
        135deg,
        #b8860b,
        #f5e6a3,
        #ffd700,
        #c9a84c,
        #fff8dc,
        #daa520,
        #b8860b
      );
      background-size: 300% 300%;
      animation: goldFlow 5s ease infinite;
      -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      z-index: 2;
    }
    @keyframes goldFlow {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .card-empire .card-cover::after {

      inset: 0;

    .card-empire .card-label {

      font-weight: 600;
      letter-spacing: 0.03em;
      transition: background 0.2s, transform 0.15s;
    }
    .modal .pdf-link:hover {
      background: #c4181e;
      transform: translateY(-1px);

    /* Dashed guide ring — same center as cards, r = 200px */

      left: 50%;
      bottom: -100px;
      width: 0;
      height: 0;
      pointer-events: none;
      z-index: 2;
    }
    .guide-ring-circle {
      position: absolute;
      left: 0;
      top: 0;
      width: 400px;
      height: 400px;
      margin-left: -200px;
      margin-top: -200px;
      border: 1.5px dashed #aaa;
      border-radius: 50%;
      box-sizing: border-box;
    }

    /* ME compass on the guide ring — always points at SPACE card */

      top: 0;

      height: 0;

      top: 50%;

    }

    /* Modal */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .modal.active {
      opacity: 1;
      pointer-events: all;
    }
    .modal-content {
      background: #fff;
      border-radius: 20px;
      max-width: 480px;
      width: 90%;
      max-height: 85vh;
      overflow-y: auto;
      padding: 2rem;
      position: relative;
      transform: scale(0.9) translateY(20px);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .modal.active .modal-content {
      transform: scale(1) translateY(0);
    }
    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      width: 36px;
      height: 36px;
      border: none;
      background: #eee;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .modal-close:hover { background: #ddd; }
    .modal h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.6rem;
      margin-bottom: 0.5rem;
    }
    .modal .tag {

      padding: 3px 10px;
      border-radius: 20px;

<body>
  <span class="cross cross-1">+</span>
  <span class="cross cross-2">+</span>
  <span class="cross cross-3">+</span>
  <span class="cross cross-4">+</span>

  <header class="header">
    <div class="welcome">Моє</div>
    <div class="title-wrapper">
      <div id="wordmark"></div>
    </div>
    <div class="meta">
      <span>Діденко Данило</span>
      <span>9-А</span>
    </div>
  </header>

  <div class="stage" id="stage">
    <div class="guide-ring" id="guideRing">
      <div class="guide-ring-circle" id="guideRingCircle"></div>
      <div class="me-marker" id="meMarker">
        <span class="me-arrow">▲</span>
        <span class="me-text">ME</span>
      </div>
    </div>
    <div class="circle-track" id="circleTrack">
      <!-- cards injected by JS -->
    </div>
    <div class="hint">свайпни або натисни картку</div>
  </div>

  <div class="modal" id="modal">
    <div class="modal-content">
      <button class="modal-close" id="modalClose">×</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script>
  /* ═══════════════════════════════════════════════════════════
     1. CIRCULAR CARD CAROUSEL
     Center at bottom, radius 500px. Cards 2× larger.
     Smooth slow rotation; continuous RAF loop (no jitter).
     Guide ring r=200 + ME compass always points at SPACE card.
  ═══════════════════════════════════════════════════════════ */
  (function () {
    const RADIUS_DESKTOP = 500;
    const RING_RADIUS_DESKTOP = 200;
    let RADIUS = RADIUS_DESKTOP;
    let RING_RADIUS = RING_RADIUS_DESKTOP;
    const SPACE_IDX = 1; // photo card (ME compass)
    // ~14 cards → arc step ≈ card width, only corner overlap
    const TOTAL_CARDS = 14;
    const LIFT_MAX = 24;
    const SCALE_MAX = 1.08;
    const IDLE_DELAY = 450;
    const EASE_RIGHT = 0.13;
    const EASE_LEFT_LEAD = 0.09;
    const EASE_LEFT_TRAIL = 0.025;
    const STAGGER = 0.03;
    const MAX_RANK_LAG = 8;

    const track = document.getElementById('circleTrack');
    const stage = document.getElementById('stage');
    const meMarker = document.getElementById('meMarker');
    const guideRingCircle = document.getElementById('guideRingCircle');

    function sizeCarousel() {
      const w = stage.clientWidth || window.innerWidth;
      const h = stage.clientHeight || window.innerHeight;
      const isMobile = window.innerWidth <= 700;
      const cardHalf = isMobile ? (window.innerWidth <= 380 ? 50 : 59) : 93.5;
      const pad = isMobile ? 8 : 24;
      const maxR = Math.max(140, Math.min(w / 2 - cardHalf - pad, h * 0.72));
      const baseR = isMobile ? Math.min(260, maxR) : RADIUS_DESKTOP;
      RADIUS = isMobile ? baseR * 4 : RADIUS_DESKTOP;
      RING_RADIUS = isMobile ? Math.max(70, RADIUS * 0.42) : RING_RADIUS_DESKTOP;
      if (guideRingCircle) {
        const d = RING_RADIUS * 2;
        guideRingCircle.style.width = d + 'px';
        guideRingCircle.style.height = d + 'px';
        guideRingCircle.style.marginLeft = -RING_RADIUS + 'px';
        guideRingCircle.style.marginTop = -RING_RADIUS + 'px';
      }
    }
    sizeCarousel();

    const realCards = [
      `<div class="card card-site" data-card="site">
        <div class="card-cover">
          <img src="cards/site.png" alt="Шкільний сайт">
        </div>
        <div class="card-label">Шкільний сайт</div>
      </div>`,
      `<div class="card card-space" data-card="nebula">
        <div class="space-photo">
          <img src="me.png" alt="Діденко Данило">
        </div>
      </div>`,
      `<div class="card card-empire" data-card="empire">
        <div class="card-cover">
          <img src="cards/empirecraft.png" alt="EmpireCraft">
        </div>
        <div class="card-label">EmpireCraft</div>
      </div>`,
      `<div class="card card-nature" data-card="nature">
        <div class="card-cover">
          <img src="cards/nature-1.jpg" alt="Природа">
        </div>
        <div class="card-label">Природа</div>
      </div>`,
      `<div class="card card-knight" data-card="knight">
        <div class="card-cover">
          <img src="cards/knight-02.jpg" alt="Лицарство">
        </div>
        <div class="card-label">Лицарство<br>в Західній Європі</div>
      </div>`,
      `<div class="card card-zhuk" data-card="zhuk">
        <div class="card-cover">
          <img src="cards/zhuk-1.jpg" alt="Михайло Жук">
        </div>
        <div class="card-label">Михайло Жук</div>
      </div>`,
      `<div class="card card-cats" data-card="cats">
        <div class="card-cover">
          <img src="cards/cats-1.jpg" alt="Породи котів">
        </div>
        <div class="card-label">Породи котів</div>
      </div>`,
      `<div class="card card-sea" data-card="sea">
        <div class="card-cover">
          <img src="cards/sea-01.jpg" alt="Морська хвороба">
        </div>
        <div class="card-label">Морська<br>хвороба</div>
      </div>`,
      `<div class="card card-gramota-photo" data-card="olymp">
        <div class="card-cover">
          <img src="cards/olymp.png" alt="Олімпіада з хімії">
        </div>
        <div class="card-label">Олімпіада з хімії</div>
      </div>`,
      `<div class="card card-gramota-photo" data-card="mechnikov">
        <div class="card-cover">
          <img src="cards/mechnikov.png" alt="Турнір Мечникова">
        </div>
        <div class="card-label">Турнір Мечникова</div>
      </div>`,
      `<div class="card card-read" data-card="read">
        <div class="card-cover">
          <img src="cards/book.png" alt="Читання">
        </div>
        <div class="card-label">Читання</div>
      </div>`,
      `<div class="card card-chess" data-card="chess">
        <div class="card-cover">
          <img src="cards/chess.png" alt="Шахи">
        </div>
        <div class="card-label">Шахи</div>
      </div>`,
      `<div class="card card-medals" data-card="medals">
        <div class="card-cover">
          <img src="cards/medals.png" alt="Автомоделювання">
        </div>
        <div class="card-label">Автомоделювання</div>
      </div>`
    ];

    const parts = [];
    for (let i = 0; i < TOTAL_CARDS; i++) {
      if (i < realCards.length) {
        parts.push(realCards[i].replace(/class="card/, `data-idx="${i}" class="card`));
      } else if (i === TOTAL_CARDS - 1) {
        // one empty "future" card at the back of the circle
        parts.push(`<div class="card card-empty" data-idx="${i}" data-card="future"></div>`);
      } else {
        parts.push(`<div class="card card-empty" data-idx="${i}" style="opacity:0;pointer-events:none;"></div>`);
      }
    }
    track.innerHTML = parts.join('');

    const cards = Array.from(track.querySelectorAll('.card'));
    const step = 360 / TOTAL_CARDS;

    // Home: photo (SPACE) card at top
    const homeRotation = SPACE_IDX * (360 / TOTAL_CARDS);
    const rot = new Float32Array(TOTAL_CARDS);
    for (let i = 0; i < TOTAL_CARDS; i++) rot[i] = homeRotation;
    let targetRotation = homeRotation;
    let moveDir = 0;
    let leadIdx = SPACE_IDX;
    let activeIdx = -1;
    let hoverIdx = -1;
    let liftAmt = 0;
    let idleTimer = null;
    let lastTs = 0;
    let moveSpan = 1;
    let drag = null;

    function isCoarse() {
      return window.matchMedia('(pointer: coarse)').matches || window.innerWidth <= 700;
    }

    function baseAngle(i) {
      return 90 - i * step;
    }

    function shortestDiff(from, to) {
      let d = to - from;
      while (d > 180) d -= 360;
      while (d < -180) d += 360;
      return d;
    }

    function wrapRot(v) {
      if (v > 360 || v < -360) {
        v = ((v % 360) + 360) % 360;
        if (v > 180) v -= 360;
      }
      return v;
    }

    function trailRank(i, lead, dir) {
      if (dir >= 0) return (i - lead + TOTAL_CARDS) % TOTAL_CARDS;
      return (lead - i + TOTAL_CARDS) % TOTAL_CARDS;
    }

    function avgRot() {
      let s = 0;
      for (let i = 0; i < TOTAL_CARDS; i++) s += rot[i];
      return s / TOTAL_CARDS;
    }

    function setTarget(t, lead) {
      const ref = rot[lead >= 0 ? lead : leadIdx] ?? avgRot();
      const delta = shortestDiff(ref, t);
      if (Math.abs(delta) > 0.5) {
        moveDir = delta > 0 ? 1 : -1;
        moveSpan = Math.max(Math.abs(delta), 1);
      }
      targetRotation = ref + delta;
    }

    function layout() {
      const r = RADIUS;
      cards.forEach((card, i) => {
        const a = (baseAngle(i) + rot[i]) * Math.PI / 180;
        const x = Math.cos(a) * r;
        const y = -Math.sin(a) * r;
        const tilt = (x / r) * 14;
        const isActive = activeIdx === i;
        const scale = 1 + (SCALE_MAX - 1) * (isActive ? liftAmt : 0);
        const lift = isActive ? -LIFT_MAX * liftAmt : 0;
        let z = Math.round(100 + Math.sin(a) * 80) * 100 + i;
        if (isActive && liftAmt > 0.2) z += 50000;
        card.style.transform =
          `translate3d(${x}px, ${y + lift}px, 0) rotate(${tilt}deg) scale(${scale})`;
        card.style.zIndex = z;
        card.classList.toggle('is-active', isActive && liftAmt > 0.3);
      });

      if (meMarker) {
        const aDeg = baseAngle(SPACE_IDX) + rot[SPACE_IDX];
        const a = aDeg * Math.PI / 180;
        const mx = Math.cos(a) * RING_RADIUS;
        const my = -Math.sin(a) * RING_RADIUS;
        meMarker.style.transform = `translate3d(${mx}px, ${my}px, 0)`;
        const arrow = meMarker.querySelector('.me-arrow');
        if (arrow) {
          const arrowRot = 90 - aDeg;
          arrow.style.transform = `translate(-50%, -50%) rotate(${arrowRot}deg)`;
        }
      }
    }

    function tick(ts) {
      if (!lastTs) lastTs = ts;
      const dt = Math.min(32, ts - lastTs) / 16.67;
      lastTs = ts;

      const lead = leadIdx >= 0 ? leadIdx : 0;
      const leadDiff = shortestDiff(rot[lead], targetRotation);
      const leadDist = Math.abs(leadDiff);
      const progress = moveSpan > 0.5
        ? Math.min(1, 1 - leadDist / moveSpan)
        : 1;
      const isDragging = !!drag;

      for (let i = 0; i < TOTAL_CARDS; i++) {
        const rank = Math.min(trailRank(i, lead, moveDir), MAX_RANK_LAG);
        const diff = shortestDiff(rot[i], targetRotation);
        let ease;

        if (isDragging) {
          // During drag: all cards follow the finger together (no trail lag).
          // Trail stagger breaks on direction reverse and freezes the ring.
          ease = 0.45;
        } else if (moveDir > 0) {
          const staggerSlow = 1 / (1 + rank * STAGGER * 10);
          ease = EASE_RIGHT * staggerSlow;
          const cardDist = Math.abs(diff);
          const cardProg = moveSpan > 0.5
            ? Math.min(1, 1 - cardDist / moveSpan)
            : 1;
          const eio = cardProg * (1 - cardProg) * 4;
          ease *= 0.5 + 0.5 * Math.max(eio, 0.2);
        } else if (moveDir < 0) {
          if (rank === 0) {
            ease = EASE_LEFT_LEAD;
          } else {
            const inertia = progress * progress * 0.1;
            ease = EASE_LEFT_TRAIL / (1 + rank * 0.4) + inertia;
          }
        } else {
          ease = 0.12;
        }

        const k = 1 - Math.pow(1 - ease, dt);
        rot[i] = wrapRot(rot[i] + diff * k);
      }

      const liftK = 1 - Math.pow(1 - 0.08, dt);
      liftAmt += ((activeIdx >= 0 ? 1 : 0) - liftAmt) * liftK;

      if (!isDragging && leadDist < 0.15 && moveDir !== 0) {
        let maxLag = 0;
        for (let i = 0; i < TOTAL_CARDS; i++) {
          maxLag = Math.max(maxLag, Math.abs(shortestDiff(rot[i], targetRotation)));
        }
        if (maxLag < 0.3) moveDir = 0;
      }

      layout();
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    function goTo(idx) {
      clearTimeout(idleTimer);
      hoverIdx = idx;
      activeIdx = idx;
      leadIdx = idx;
      let t = 90 - baseAngle(idx);
      setTarget(t, idx);
    }

    function goHome() {
      activeIdx = -1;
      leadIdx = SPACE_IDX;
      setTarget(homeRotation, SPACE_IDX);
    }

    function scheduleIdle() {
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => {
        if (hoverIdx < 0 && !drag) goHome();
      }, IDLE_DELAY);
    }

    cards.forEach((card, i) => {
      card.addEventListener('pointerenter', (e) => {
        if (e.pointerType === 'touch' || isCoarse()) return;
        goTo(i);
      });
      card.addEventListener('pointerleave', (e) => {
        if (e.pointerType === 'touch' || isCoarse()) return;
        if (hoverIdx === i) hoverIdx = -1;
        scheduleIdle();
      });
    });

    stage.addEventListener('pointerleave', () => {
      if (isCoarse()) return;
      hoverIdx = -1;
      clearTimeout(idleTimer);
      goHome();
    });

    layout();
    window.addEventListener('resize', () => {
      sizeCarousel();
      layout();
    });

    stage.addEventListener('pointerdown', (e) => {
      if (!isCoarse()) return;
      // Start from a clean synced state so reverse drags never inherit lag
      const base = avgRot();
      for (let i = 0; i < TOTAL_CARDS; i++) rot[i] = base;
      targetRotation = base;
      moveDir = 0;
      drag = { id: e.pointerId, x: e.clientX, rot: base, moved: false };
      try { stage.setPointerCapture(e.pointerId); } catch (_) {}
    });
    stage.addEventListener('pointermove', (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      e.preventDefault();
      const dx = e.clientX - drag.x;
      if (Math.abs(dx) > 6) drag.moved = true;
      const next = drag.rot + dx * 0.28;
      leadIdx = SPACE_IDX;
      moveDir = 0;
      targetRotation = next;
      activeIdx = -1;
      hoverIdx = -1;
    }, { passive: false });
    // Block native scroll/back gesture on direction reverse (WebKit/Chrome),
    // which otherwise fires pointercancel and freezes the ring.
    stage.addEventListener('touchmove', (e) => {
      if (drag) e.preventDefault();
    }, { passive: false });
    let justSwiped = false;
    function endDrag(e) {
      if (!drag) return;
      if (e && e.pointerId != null && e.pointerId !== drag.id) return;
      const wasSwipe = drag.moved;
      // Snap all cards to the final target so the next gesture starts clean
      for (let i = 0; i < TOTAL_CARDS; i++) rot[i] = targetRotation;
      moveDir = 0;
      drag = null;
      if (wasSwipe) {
        justSwiped = true;
        setTimeout(() => { justSwiped = false; }, 0);
        hoverIdx = -1;
        scheduleIdle();
      }
    }
    stage.addEventListener('pointerup', endDrag);
    stage.addEventListener('pointercancel', endDrag);
    stage.addEventListener('lostpointercapture', endDrag);

    // Modal
    const cardData = {
      site: {
        title: "Шкільний сайт",
        tag: "Web / UI",
        content: `<p>Майбутній аналог програми "Мрія", поки іще в розробці.</p>`
      },
      nebula: {
        title: "Діденко Данило",
        tag: "Про мене",
        content: `<p><strong>9-А</strong></p>
          <p>Це я!</p>
          <ul><li>Кандидат на посаду "Голова комітету звукового і технічного оформлення"</li></ul>`
      },
      empire: {
        title: "EmpireCraft",
        tag: "Minecraft / Web",
        content: `<p>Колись хотів зробити свій сервер в майнкрафті...</p>
          <a class="pdf-link" href="EmpireCraft.pdf" target="_blank" rel="noopener">Відкрити презентацію →</a>`
      },
      nature: {
        title: "Природа",
        tag: "Презентація",
        content: `<p>“Коли буде зрубано останнє дерево, отруєно останню річку і впіймано останнього птаха, — тільки тоді ви збагнете, що гроші не можна їсти.”</p>
          <a class="pdf-link" href="Nature.pdf" target="_blank" rel="noopener">Відкрити презентацію →</a>`
      },
      knight: {
        title: "Лицарство в Західній Європі",
        tag: "Історія / Презентація",
        content: `<p>Одна з моїх найперших презентацій, і досі іноді використовую її як шаблон.</p>
          <ul><li>Презентація з історії</li></ul>
          <a class="pdf-link" href="Lytsarstvo.pdf" target="_blank" rel="noopener">Відкрити презентацію →</a>`
      },
      zhuk: {
        title: "Михайло Жук",
        tag: "Мистецтво / Презентація",
        content: `<p>Презентація про українського художника Михайла Жука.</p>
          <p>Видатний український художник, графік, кераміст, поет і педагог.</p>
          <ul><li>Презентація з мистецтва</li></ul>
          <a class="pdf-link" href="Mykhailo.pdf" target="_blank" rel="noopener">Відкрити презентацію →</a>`
      },
      cats: {
        title: "Породи котів",
        tag: "Презентація",
        content: `<p>Котики)))</p>
          <a class="pdf-link" href="Porody.pdf" target="_blank" rel="noopener">Відкрити презентацію →</a>`
      },
      sea: {
        title: "Морська хвороба",
        tag: "Презентація",
        content: `<p>Презентація про морську хворобу — причини, симптоми та як з нею справлятися в морі.</p>
          <ul><li>Презентація з біології</li></ul>
          <a class="pdf-link" href="Morska_khvoroba.pdf" target="_blank" rel="noopener">Відкрити презентацію →</a>`
      },
      olymp: {
        title: "Олімпіада з хімії",
        tag: "Досягнення",
        content: `<p><strong>I місце в ІІ етапі Всеукраїнської учнівської олімпіади з хімії</strong> у 2025/2026 навчальному році.</p>
          <ul><li>Обласна олімпіада</li><li>Хімія</li><li>2025/2026</li></ul>`
      },
      mechnikov: {
        title: "Турнір ім. Мечникова",
        tag: "Досягнення",
        content: `<p><strong>I місце у XXVII Хіміко-біологічному турнірі імені І. І. Мечникова</strong> (23 листопада 2025 року).</p>
          <p>Організатор — Навчально-науковий інститут Хімії ХНУ імені В. Н. Каразіна.</p>

      read: {
        title: "Читання",

  /* ═══════════════════════════════════════════════════════════
     2. VECTOR WORDMARK (vanilla port of Originkit component)

  (function () {
    const MAX_DPR = 2;
    const REF_WIDTH = 1200;
    const MAX_TEX = 4096;
    const HANDLES = 3;
    const CELL_ASPECT = 0.6;
    const DRIFT_X = 0.08;
    const DRIFT_Y = 0.04;
    const DRIFT_RATE = 1.3;
    const DRIFT_RATE_Y = 1.3 * 1.3;
    const SWEEP_RATE = 0.5;
    const SWEEP_BAND = 0.28;
    const RESNAP = 0.2;
    const DAMP_REF = 20;
    const SPEED_REF = 50;
    const LABEL_MAX = 0.6;
    const DOT_DIAMETER = 4 / 440;
    const DOT_PITCH = 12 / 440;

    const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
    const fract = (x) => x - Math.floor(x);

    function parseColor(input, fallback) {
      if (!input) return fallback;
      let s = String(input).trim();
      if (s.slice(0, 4).toLowerCase() === "var(") {
        const comma = s.indexOf(",");
        const close = s.lastIndexOf(")");
        if (comma < 0 || close < comma) return fallback;
        s = s.slice(comma + 1, close).trim();
      }
      if (s[0] === "#") {
        let h = s.slice(1);
        if (h.length === 3 || h.length === 4) {
          let x = "";
          for (const c of h) x += c + c;
          h = x;
        }
        if (h.length === 6) h += "ff";
        if (h.length !== 8 || /[^0-9a-f]/i.test(h)) return fallback;
        return [
          parseInt(h.slice(0, 2), 16) / 255,
          parseInt(h.slice(2, 4), 16) / 255,
          parseInt(h.slice(4, 6), 16) / 255,
          parseInt(h.slice(6, 8), 16) / 255,
        ];
      }
      const m = s.match(/^(rgba?|hsla?)\(([^)]*)\)$/i);
      if (!m) return fallback;
      const parts = m[2].split(/[\s,/]+/).filter((p) => p.length > 0);
      if (parts.length < 3) return fallback;
      const num = (t, scale) => {
        const v = parseFloat(t);
        if (!Number.isFinite(v)) return 0;
        return t.indexOf("%") >= 0 ? (v / 100) * scale : v;
      };
      const alpha = parts.length > 3 ? clamp(num(parts[3], 1), 0, 1) : 1;
      if (m[1].toLowerCase().slice(0, 3) === "rgb") {
        return [
          clamp(num(parts[0], 255) / 255, 0, 1),
          clamp(num(parts[1], 255) / 255, 0, 1),
          clamp(num(parts[2], 255) / 255, 0, 1),
          alpha,
        ];
      }
      const hh = fract(parseFloat(parts[0]) / 360);
      const sat = clamp(num(parts[1], 1), 0, 1);
      const li = clamp(num(parts[2], 1), 0, 1);
      const q = li < 0.5 ? li * (1 + sat) : li + sat - li * sat;
      const p = 2 * li - q;
      const chan = (t) => {
        let u = fract(t);
        if (u < 1 / 6) return p + (q - p) * 6 * u;
        if (u < 1 / 2) return q;
        if (u < 2 / 3) return p + (q - p) * (2 / 3 - u) * 6;
        return p;
      };
      return [chan(hh + 1 / 3), chan(hh), chan(hh - 1 / 3), alpha];
    }

    const VERT = `
attribute vec2 aPos;
varying vec2 vUv;
void main() {
    vUv = aPos * 0.5 + 0.5;
    gl_Position = vec4(aPos, 0.0, 1.0);
}`;

    const FRAG = `
precision highp float;
uniform sampler2D uMap;
uniform vec2 uRes;
uniform vec2 uAtlas;
uniform vec2 uPtr;
uniform float uReach;
uniform vec3 uText;
uniform vec3 uShade;
uniform vec4 uAccent;
uniform vec2 uV0;
uniform vec2 uV1;
uniform vec2 uV2;
uniform float uHalf;
varying vec2 vUv;
float hash(vec2 p) {
    return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453);
}
vec2 blurRG(vec2 uv, float e) {
    vec4 sum = vec4(0.0);
    for (int i = 0; i < 6; i++) {
        float fi = float(i);
        float th = radians(fi / 6.0 * 360.0);
        vec2 dir = vec2(cos(th), sin(th));
        vec2 off = dir * (hash(vec2(fi, uv.x + uv.y)) + e);
        sum += texture2D(uMap, uv + off * e);
    }
    return (sum / 6.0).rg;
}
vec2 segment(vec2 p, vec2 a, vec2 b) {
    vec2 ab = b - a;
    vec2 ap = p - a;
    float t = clamp(dot(ap, ab) / max(dot(ab, ab), 1e-8), 0.0, 1.0);
    return vec2(length(ap - ab * t), t);
}
float stroke(float d, float lw, float px) {
    return 1.0 - smoothstep(lw, lw + px, d);
}
float dashedLine(vec2 p, vec2 a, vec2 b, float lw, float px) {
    vec2 s = segment(p, a, b);
    float dash = step(0.5, fract(s.y * length(b - a) * 100.0));
    return stroke(s.x, lw, px) * dash;
}
float boxEdge(vec2 p, vec2 c, float h, float lw, float px) {
    vec2 q = abs(p - c) - vec2(h);
    float d = length(max(q, 0.0)) + min(max(q.x, q.y), 0.0);
    return stroke(abs(d), lw, px);
}
void main() {
    float aspect = uRes.x / uRes.y;
    vec2 E = (vUv * uRes - (uRes - uAtlas) * 0.5) / uAtlas;
    float inside = step(0.0, E.x) * step(E.x, 1.0) * step(0.0, E.y) * step(E.y, 1.0);
    vec2 safeUv = clamp(E, 0.0, 1.0);
    float b = clamp(1.0 - E.y * 3.5, 0.0, 1.0) * 0.008;
    vec2 soft = blurRG(safeUv, b);
    vec2 sharp = blurRG(safeUv, b * 0.1);
    float d = length((vUv - uPtr) / vec2(1.0, aspect));
    float k = 1.0 - pow(smoothstep(0.0, max(uReach, 1e-4), d), 3.0);
    float mask = mix(soft.r, sharp.g, k) * inside;
    vec3 fill = mix(uShade, uText, smoothstep(0.0, 1.0, E.y));
    vec2 P = vec2(vUv.x * aspect, vUv.y);
    float px = 1.0 / uRes.y;
    float lw = px * 0.2;
    float lines = max(
        max(dashedLine(P, uV0, uV1, lw, px), dashedLine(P, uV1, uV2, lw, px)),
        dashedLine(P, uV2, uV0, lw, px)
    );
    float boxes = max(
        max(boxEdge(P, uV0, uHalf, lw, px), boxEdge(P, uV1, uHalf, lw, px)),
        boxEdge(P, uV2, uHalf, lw, px)
    );
    float A = max(lines, boxes) * uAccent.a * (1.0 - vUv.y);
    vec4 card = vec4(fill * mask, mask);
    vec4 comp = vec4(uAccent.rgb * A, A) + card * (1.0 - A);
    gl_FragColor = comp * pow(clamp(E.y, 0.0, 1.0), 0.7);
}`;

    function compile(gl, vs, fs) {
      const make = (type, src) => {
        const sh = gl.createShader(type);
        gl.shaderSource(sh, src);
        gl.compileShader(sh);
        return sh;
      };
      const p = gl.createProgram();
      gl.attachShader(p, make(gl.VERTEX_SHADER, vs));
      gl.attachShader(p, make(gl.FRAGMENT_SHADER, fs));
      gl.bindAttribLocation(p, 0, "aPos");
      gl.linkProgram(p);
      return p;
    }

    function fontString(f, px) {
      return `${f.style} ${f.weight} ${px}px ${f.family}`;
    }

    function buildAtlas(text, f, drawFontPx, dpr) {
      const probe = document.createElement("canvas").getContext("2d");
      if (!probe) return null;
      const setFont = (ctx, px) => {
        ctx.font = fontString(f, px);
        try {
          if ("letterSpacing" in ctx) {
            ctx.letterSpacing = f.letterSpacing;
          }
        } catch (e) {}
      };
      const measure = (px) => {
        setFont(probe, px);
        const m = probe.measureText(text);
        const asc = m.actualBoundingBoxAscent || px * 0.8;
        const desc = m.actualBoundingBoxDescent || px * 0.22;
        return { w: Math.max(1, m.width), asc, desc };
      };
      let fpx = Math.max(8, drawFontPx * dpr);
      let m = measure(fpx);
      let pad = fpx * 0.12;
      const over = Math.max(
        (m.w + pad * 2) / MAX_TEX,
        (m.asc + m.desc + pad * 2) / MAX_TEX
      );
      if (over > 1) {
        fpx = Math.max(8, fpx / over);
        m = measure(fpx);
        pad = fpx * 0.12;
      }
      const w = Math.max(1, Math.ceil(m.w + pad * 2));
      const h = Math.max(1, Math.ceil(m.asc + m.desc + pad * 2));
      const canvas = document.createElement("canvas");
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext("2d");
      if (!ctx) return null;
      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, w, h);
      setFont(ctx, fpx);
      ctx.textBaseline = "alphabetic";
      ctx.textAlign = "left";
      ctx.globalCompositeOperation = "lighter";
      ctx.fillStyle = "#ff0000";
      ctx.fillText(text, pad, pad + m.asc);
      const block = m.asc + m.desc;
      ctx.strokeStyle = "#00ff00";
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.lineWidth = Math.max(1, block * DOT_DIAMETER);
      ctx.setLineDash([0, Math.max(2, block * DOT_PITCH)]);
      ctx.strokeText(text, pad, pad + m.asc);
      const cssPerPx = drawFontPx / fpx;
      return { canvas, cssW: w * cssPerPx, cssH: h * cssPerPx };
    }

    // Mount
    const host = document.getElementById("wordmark");
    if (!host) return;

    const text = "ПОРТФОЛІО";
    const fontSpec = {
      family: "Inter, system-ui, sans-serif",
      weight: "800",
      style: "normal",
      size: 180,
      letterSpacing: "-0.02em",
    };
    const background = "transparent";
    const textColor = "#111111";
    const shade = "#111111";
    const accent = "rgba(227, 28, 35, 0.55)";
    const reach = 220;
    const speed = 50;
    const damping = 55;
    const hg = { size: 72, spread: 22, labels: false };
    const accentRGBA = parseColor(accent, [1, 1, 1, 0.4]);

    // Build DOM
    host.style.cssText = `position:relative;overflow:hidden;background:${background};width:100%;height:100%;`;
    const canvas = document.createElement("canvas");
    canvas.style.cssText = "position:absolute;inset:0;width:100%;height:100%;display:block;";
    host.appendChild(canvas);

    const attrs = {
      alpha: true,
      antialias: false,
      depth: false,
      stencil: false,
      premultipliedAlpha: true,
      powerPreference: "high-performance",
    };
    const gl = (canvas.getContext("webgl2", attrs) || canvas.getContext("webgl", attrs));
    if (!gl) {
      // fallback plain text
      host.innerHTML = `<div style="font-family:Inter,sans-serif;font-weight:800;font-size:clamp(2.5rem,10vw,5.5rem);letter-spacing:-0.04em;text-align:center;line-height:1;color:#111;padding-top:1.2rem;">ПОРТФОЛІО</div>`;
      return;
    }

    const isGL2 = typeof WebGL2RenderingContext !== "undefined" && gl instanceof WebGL2RenderingContext;
    const prog = compile(gl, VERT, FRAG);
    const U = {
      map: gl.getUniformLocation(prog, "uMap"),
      res: gl.getUniformLocation(prog, "uRes"),
      atlas: gl.getUniformLocation(prog, "uAtlas"),
      ptr: gl.getUniformLocation(prog, "uPtr"),
      reach: gl.getUniformLocation(prog, "uReach"),
      text: gl.getUniformLocation(prog, "uText"),
      shade: gl.getUniformLocation(prog, "uShade"),
      accent: gl.getUniformLocation(prog, "uAccent"),
      v0: gl.getUniformLocation(prog, "uV0"),
      v1: gl.getUniformLocation(prog, "uV1"),
      v2: gl.getUniformLocation(prog, "uV2"),
      half: gl.getUniformLocation(prog, "uHalf"),
    };

    const quad = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, quad);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    gl.disable(gl.BLEND);

    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0, 0, 0, 255]));
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

    let alive = true;
    let boxW = Math.max(1, host.offsetWidth);
    let boxH = Math.max(1, host.offsetHeight);
    let boxDirty = true;
    let dpr = 1;
    let bufW = 0;
    let bufH = 0;
    let atlasRatioW = 1;
    let atlasRatioH = 1;
    let atlasKey = "";

    function drawFontPx() {
      return fontSpec.size * (boxW / REF_WIDTH);
    }

    function resize() {
      boxW = Math.max(1, host.offsetWidth);
      boxH = Math.max(1, host.offsetHeight);
      dpr = Math.min(MAX_DPR, window.devicePixelRatio || 1);
      const w = Math.max(1, Math.round(boxW * dpr));
      const h = Math.max(1, Math.round(boxH * dpr));
      if (w === bufW && h === bufH) return;
      bufW = w;
      bufH = h;
      canvas.width = w;
      canvas.height = h;
    }

    function rebuildAtlas() {
      const px = Math.max(8, drawFontPx());
      const atlas = buildAtlas(text || " ", fontSpec, px, dpr);
      if (!atlas) return;
      atlasRatioW = Math.max(1e-4, atlas.cssW / px);
      atlasRatioH = Math.max(1e-4, atlas.cssH / px);
      if (typeof document !== "undefined" && document.fonts) {
        try {
          const probe = fontString(fontSpec, 64);
          if (!document.fonts.check(probe)) {
            document.fonts.load(probe, text).then(() => { if (alive) atlasKey = ""; }, () => {});

        } catch (e) {}

      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, atlas.canvas);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
      const cw = atlas.canvas.width;
      const ch = atlas.canvas.height;
      const pot = (cw & (cw - 1)) === 0 && (ch & (ch - 1)) === 0;
      if (isGL2 || pot) {
        gl.generateMipmap(gl.TEXTURE_2D);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
      } else {
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      }
    }

    const target = { x: -0.5, y: 0.5 };
    const eased = { x: -0.5, y: 0.5 };
    const cells = [];
    const verts = [];
    for (let i = 0; i < HANDLES; i += 1) {
      cells.push({ x: -0.5, y: 0.5 });
      verts.push({ x: -0.5, y: 0.5 });
    }
    let hasPointer = false;
    let sweepClock = 0;
    let driftT = 0;

    function snap(x, y, cw, ch) {
      const cx = Math.floor(x / cw);
      const cy = Math.floor(y / ch);
      const found = [];
      for (let i = -1; i <= 1; i += 1) {
        for (let j = -1; j <= 1; j += 1) {
          const px = (cx + i + 0.5) * cw;
          const py = (cy + j + 0.5) * ch;
          found.push({ x: px, y: py, d: Math.hypot(px - x, py - y) });
        }
      }
      found.sort((a, b) => a.d - b.d);
      for (let i = 0; i < HANDLES; i += 1) {
        cells[i].x = found[i + 1].x;
        cells[i].y = found[i + 1].y;
      }
    }

    const onMove = (e) => {
      hasPointer = true;
      const r = host.getBoundingClientRect();
      if (r.width <= 0 || r.height <= 0) return;
      target.x = (e.clientX - r.left) / r.width;
      target.y = 1 - (e.clientY - r.top) / r.height;
    };
    host.addEventListener("pointermove", onMove);
    host.addEventListener("pointerleave", () => { hasPointer = false; });

    let rafId = 0;
    let last = 0;
    let running = true;

    function sync() {
      if (boxDirty) {
        boxDirty = false;
        resize();
      }
      const key = [
        text,
        fontSpec.family,
        fontSpec.weight,
        fontSpec.style,
        fontSpec.letterSpacing,
        dpr,
        Math.ceil(Math.max(8, drawFontPx()) / 64),
      ].join("|");
      if (key !== atlasKey) {
        atlasKey = key;
        rebuildAtlas();
      }
    }

    function step(dt) {
      const rate = Math.max(0, speed) / SPEED_REF;
      const cw = Math.max(0.01, hg.spread / 100);
      const ch = cw * CELL_ASPECT;
      const aspect = boxW / boxH;
      if (!hasPointer) {
        const band = (atlasRatioH * Math.max(8, drawFontPx())) / boxH;
        target.x += dt * SWEEP_RATE * rate;
        target.y = (1 - band) / 2 + SWEEP_BAND * band;
        if (target.x > 1.5) {
          target.x = -0.5;
          eased.x = -0.5;
        }
        sweepClock += dt;
        if (sweepClock >= RESNAP) {
          sweepClock = 0;
          snap(target.x * aspect, target.y, cw, ch);
        }
      } else {
        snap(target.x * aspect, target.y, cw, ch);
      }
      const damp = clamp((damping / 100) * DAMP_REF * dt, 0, 1);
      eased.x += (target.x - eased.x) * damp;
      eased.y += (target.y - eased.y) * damp;
      driftT += dt * rate;
      for (let i = 0; i < HANDLES; i += 1) {
        const c = cells[i];
        const sx = Math.round(c.x / cw - 0.5);
        const sy = Math.round(c.y / ch - 0.5);
        const h1 = fract(Math.sin(sx * 127.1 + sy * 311.7) * 43758.5453);
        const h2 = fract(Math.sin(sx * 269.5 + sy * 183.3) * 43758.5453);
        verts[i].x = c.x + DRIFT_X * cw * Math.sin(driftT * DRIFT_RATE + h1 * Math.PI * 2);
        verts[i].y = c.y + DRIFT_Y * ch * Math.sin(driftT * DRIFT_RATE_Y + h2 * Math.PI * 2);
      }
    }

    function draw() {
      const tc = parseColor(textColor, [0.07, 0.07, 0.07, 1]);
      const sc = parseColor(shade, [0.07, 0.07, 0.07, 1]);
      const ac = accentRGBA;
      gl.viewport(0, 0, bufW, bufH);
      gl.useProgram(prog);
      gl.uniform1i(U.map, 0);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.uniform2f(U.res, boxW, boxH);
      const px = Math.max(8, drawFontPx());
      gl.uniform2f(U.atlas, atlasRatioW * px, atlasRatioH * px);
      gl.uniform2f(U.ptr, eased.x, eased.y);
      gl.uniform1f(U.reach, Math.max(1, reach) / boxW);
      gl.uniform3f(U.text, tc[0], tc[1], tc[2]);
      gl.uniform3f(U.shade, sc[0], sc[1], sc[2]);
      gl.uniform4f(U.accent, ac[0], ac[1], ac[2], ac[3]);
      gl.uniform2f(U.v0, verts[0].x, verts[0].y);
      gl.uniform2f(U.v1, verts[1].x, verts[1].y);
      gl.uniform2f(U.v2, verts[2].x, verts[2].y);
      gl.uniform1f(U.half, hg.size / 2 / boxH);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }

    const frame = (now) => {
      const dt = last ? Math.min(0.1, (now - last) / 1000) : 0;
      last = now;
      sync();
      step(dt);
      draw();
      rafId = requestAnimationFrame(frame);
    };

    const gate = () => {
      if (running && !document.hidden) {
        if (!rafId) {
          last = 0;
          rafId = requestAnimationFrame(frame);
        }
      } else if (rafId) {
        cancelAnimationFrame(rafId);
        rafId = 0;
      }
    };

    const ro = new ResizeObserver(() => { boxDirty = true; });
    ro.observe(host);
    document.addEventListener("visibilitychange", gate);
    if (typeof document !== "undefined" && document.fonts) {
      document.fonts.ready.then(() => { if (alive) atlasKey = ""; }, () => {});
    }
    gate();
  })();
  </script>
</body>
